<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKAY Clan Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 16px;
    }
    .card {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid #333;
    }
    .profile-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .profile-title {
      font-size: 18px;
      font-weight: bold;
    }
    .rank-badge {
      color: #f39c12;
      font-weight: bold;
    }
    .data-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #2a2a2a;
    }
    .btn {
      width: 100%;
      padding: 12px;
      background: #e74c3c;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    #loading { text-align: center; padding: 20px; }
    #auth-box { display: none; }
    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 6px;
      border: 1px solid #444;
      background: #222;
      color: #fff;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <div id="loading">Завантаження даних...</div>

  <!-- Вікно авторизації за карткою (якщо Telegram ID не знайдено) -->
  <div id="auth-box" class="card">
    <h3>Авторизація</h3>
    <p>Введіть 6 цифр вашої картки:</p>
    <input type="text" id="cardInput" placeholder="172258">
    <button class="btn" style="background:#27ae60;" onclick="loginWithCard()">Увійти</button>
  </div>

  <!-- Особистий кабінет -->
  <div id="app" style="display:none;">
    <div class="card">
      <div class="profile-header">
        <div>
          <div class="profile-title" id="userName">--</div>
          <div class="rank-badge" id="userRank">--</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="data-row"><span>День народження:</span><span id="userDob">--</span></div>
      <div class="data-row"><span>Номер карти:</span><span id="userCard">--</span></div>
      <div class="data-row"><span>Ігровий ID:</span><span id="userGameId">--</span></div>
      <div class="data-row"><span>Попередження:</span><span id="userWarnings">--</span></div>
      <div class="data-row"><span>Догани:</span><span id="userDohani">--</span></div>
      <div class="data-row"><span>Бонуси:</span><span id="userBonus">--</span></div>
      <div class="data-row"><span>Штрафи:</span><span id="userPenalty">--</span></div>
    </div>

    <button class="btn" onclick="Telegram.WebApp.close()">Закрити Кабінет</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // ЗАМІНІТЬ ЦЕ ПОСИЛАННЯ НА ВАШ НОВИЙ WEB APP URL З GOOGLE APPS SCRIPT
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwxdWSOguQiHZ7lg8c3424tfsL33wXaWkaXbX3gO4q54zHzBWvjiDTVmr0Bln9dhims/exec";

    const user = tg.initDataUnsafe?.user;
    const telegramId = user ? user.id : "";

    function loadProfile(queryParam) {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('auth-box').style.display = 'none';
      document.getElementById('app').style.display = 'none';

      fetch(`${SCRIPT_URL}?${queryParam}`)
        .then(res => res.json())
        .then(data => {
          document.getElementById('loading').style.display = 'none';
          if (data.error) {
            document.getElementById('auth-box').style.display = 'block';
          } else {
            document.getElementById('userName').innerText = data.nickname;
            document.getElementById('userRank').innerText = "Ранг: " + data.rank;
            document.getElementById('userDob').innerText = data.dob || "--";
            document.getElementById('userCard').innerText = data.card || "--";
            document.getElementById('userGameId').innerText = data.gameId || "--";
            document.getElementById('userWarnings').innerText = data.warnings || "0/3";
            document.getElementById('userDohani').innerText = data.dohani || "0/3";
            document.getElementById('userBonus').innerText = (data.bonus || 0) + " грн.";
            document.getElementById('userPenalty').innerText = (data.penalty || 0) + " грн.";
            
            document.getElementById('app').style.display = 'block';
          }
        })
        .catch(err => {
          document.getElementById('loading').innerText = "Помилка мережі";
        });
    }

    function loginWithCard() {
      const card = document.getElementById('cardInput').value.trim();
      if (card) {
        loadProfile(`card=${card}&telegramId=${telegramId}`);
      }
    }

    // Автоматичний вхід при відкритті
    if (telegramId) {
      loadProfile(`telegramId=${telegramId}`);
    } else {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('auth-box').style.display = 'block';
    }
  </script>
</body>
</html>
